<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Token consumption calendar">
  <defs>
    <linearGradient id="tcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tcBg)"/>
  <!-- calendar frame -->
  <rect x="12" y="15" width="40" height="36" rx="6" fill="none" stroke="#ffffff" stroke-width="2.6"/>
  <path d="M12 25h40" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M22 10.5v8M42 10.5v8" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- heat cells -->
  <g fill="#ffffff">
    <rect x="17" y="30" width="7" height="7" rx="2" opacity="0.35"/>
    <rect x="28.5" y="30" width="7" height="7" rx="2" opacity="0.6"/>
    <rect x="40" y="30" width="7" height="7" rx="2" opacity="0.45"/>
    <rect x="17" y="41" width="7" height="7" rx="2" opacity="0.5"/>
  </g>
  <!-- spend bar -->
  <rect x="28.5" y="41" width="18.5" height="7" rx="3.5" fill="#fbbf24"/>
</svg>
